integration: minitest
requires:
  - ./lib/dcb_event_store
  # The backends are autoloaded, and mutant enumerates its subjects from the
  # modules already loaded, so the backend files are required here explicitly
  # -- without them the backend subjects below would simply not be found.
  - ./lib/dcb_event_store/postgres_store
  - ./lib/dcb_event_store/sqlite_store
  - ./lib/dcb_event_store/store
  # Same for the driver-free snapshot store, autoloaded under Snapshots.
  - ./lib/dcb_event_store/snapshots/in_memory_snapshot_store
  - ./test/test_helper
  - ./test/unit/test_event
  - ./test/unit/test_query
  - ./test/unit/test_projection
  - ./test/unit/test_decision_model
  - ./test/unit/test_upcaster
  - ./test/unit/test_client
  - ./test/unit/test_in_memory_store
  - ./test/unit/test_notifications
  - ./test/unit/test_active_support_instrumentation
  - ./test/unit/test_log_subscriber
  - ./test/unit/test_rails_log_subscriber
  - ./test/unit/test_railtie
  - ./test/unit/test_appsignal_subscriber
  - ./test/unit/test_instrumentation
  - ./test/unit/test_snapshot_instrumentation
  - ./test/unit/test_postgres_array_codec
  - ./test/unit/test_postgres_dialect
  - ./test/unit/test_sql_builder
  - ./test/unit/test_row_mapper
  - ./test/unit/test_timestamp
  - ./test/unit/test_sql_store
  - ./test/unit/test_sqlite_dialect
  - ./test/unit/test_lock_keys
  - ./test/unit/test_snapshot
  - ./test/unit/test_in_memory_snapshot_store
  - ./test/unit/test_query_key_collisions
  - ./test/integration/test_append_only
  - ./test/integration/test_subscribe
  - ./test/integration/test_client
  - ./test/integration/test_decision_model
  - ./test/integration/test_upcaster_integration
  - ./test/integration/test_store_equivalence
  - ./test/sqlite/test_sqlite_store
  - ./test/sqlite/test_schema
  - ./test/sqlite/test_subscribe
  - ./test/sqlite/test_concurrent_append
  - ./test/concurrency/test_concurrent_append
  - ./test/concurrency/test_in_flight_append
jobs: 1
usage: opensource
matcher:
  subjects:
    - DcbEventStore::Event*
    - DcbEventStore::Query*
    - DcbEventStore::QueryItem*
    - DcbEventStore::AppendCondition*
    - DcbEventStore::Projection*
    - DcbEventStore::DecisionModel*
    - DcbEventStore::Upcaster*
    - DcbEventStore::Client*
    - DcbEventStore::InMemoryStore*
    - DcbEventStore::Notifications*
    - DcbEventStore::ActiveSupportInstrumentation*
    - DcbEventStore::LogSubscriber*
    - DcbEventStore::RailsLogSubscriber*
    - DcbEventStore::Railtie*
    - DcbEventStore::AppsignalSubscriber*
    - DcbEventStore::StoreInstrumentation*
    # Snapshots: the configuration object and the driver-free snapshot
    # store. The SQL snapshot stores are left out for the same reason as the
    # SQL event stores -- driver glue over a live server.
    - DcbEventStore::Snapshot*
    - DcbEventStore::Snapshots::InMemorySnapshotStore*
    # What survives on these two plus DecisionModel* is equivalent by
    # construction: removing a @mutex.synchronize (nothing a single-threaded
    # suite can observe), dropping a fast path that only saves work
    # (DecisionModel.read_events' single-group read), h[k] -> h.key?(k) /
    # h.fetch(k) on keys that are always present.
    # Pure collaborators extracted from the stores: SQL building, the PG
    # dialect it is parametrized with, advisory-lock key derivation, the PG
    # array codec and the created_at parser. Fast to mutate (no live PG) and
    # fully covered by dedicated unit tests.
    - DcbEventStore::SqlStore::SqlBuilder*
    - DcbEventStore::PostgresStore::Dialect*
    - DcbEventStore::SqliteStore::Dialect*
    - DcbEventStore::PostgresStore::ArrayCodec*
    - DcbEventStore::PostgresStore::LockKeys*
    - DcbEventStore::SqlStore::Timestamp*
# The four store subjects below are left out on purpose: what remains in them
# is thin driver glue (transactions, exec_params, LISTEN/NOTIFY, BEGIN
# IMMEDIATE), the read/append/subscribe orchestration over those hooks, and
# row mapping over trusted SELECT * rows. Their mutations are dominated by
# equivalent edits -- SQL-string tweaks, row["x"] -> row.fetch("x"), .to_i ->
# Integer(...) -- that only differ on inputs the databases never produce, so
# pinning them would mean contrived, out-of-contract tests. All four are
# covered by unit, integration and SQLite tests; the genuinely branching
# logic lives in the pure subjects above. Measured for reference:
#
# - SqlStore*: ~87%. Survivors are hook-call and loop-shape equivalents in
#   append/read/subscribe.
# - SqliteStore*: 98.34%, 9 of 543 alive (with the subscribe and concurrency
#   tests in place). The polling hooks (#listen, #wait_for_append) are fully
#   covered; what survives are .to_i on a value SQLite already types as
#   Integer (3), row["x"] -> row.fetch("x") (1), dropping the rescue that
#   swallows a failing ROLLBACK (1), and removing "PRAGMA synchronous=NORMAL"
#   (4), which this SQLite build already defaults to for a WAL database.
# - SqlStore::RowMapper*: 95.27%, 12 of 254 alive with test_row_mapper -- all
#   row.fetch / is_a? -> instance_of? equivalents on driver-supplied rows.
# - PostgresStore*: not measured; every mutation needs a live server, and its
#   remaining methods are the exec_params and advisory-lock glue above.
#    - DcbEventStore::PostgresStore*
#    - DcbEventStore::SqliteStore*
#    - DcbEventStore::SqlStore*
#    - DcbEventStore::SqlStore::RowMapper*
